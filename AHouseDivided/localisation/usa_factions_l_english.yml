l_english:
 faction_progressives:0 "Progressives"
 faction_progressives_influence:0 "Progressives Influence"
 faction_progressives_FACTION_DESC:0 "Progressives represent those who are seeking to reform society to make it more equitable. Progressives are more tolerant to change and to pluralism."
 faction_moderates:0 "Moderates"
 faction_moderates_influence:0 "Moderates Influence"
 faction_moderates_FACTION_DESC:0 "Moderates attempt to strike a balance between the reform of the progressives and continuity of the conservatives. They prefer gradual change, and consensus-building."
 faction_conservatives:0 "Conservatives"
 faction_conservatives_influence:0 "Conservatives Influence"
 faction_conservatives_FACTION_DESC:0 "Conservatives are those who seek to uphold the existing institutions of a country. They are more skeptical to change, preferring their societies to stick to traditional ways of life."
 ok_frontier:0 "Frontiersmen"
 ok_frontier_influence:0 "Frontier Influence"
 ok_frontier_FACTION_DESC:0 "Frontiersmen see the limitless potential beyond our settled borders, and imagine how we can benefit from its inclusion to our realm."
 ok_militia:0 "Militas"
 ok_militia_influence:0 "Militia Influence"
 ok_militia_FACTION_DESC:0 "The Militias fear the power of our stronger neighbors, and hold the belief that to survive in the current times means to be able to fight on our terms."
 ok_traders:0 "Traders"
 ok_traders_influence:0 "Traders Influence"
 ok_traders_FACTION_DESC:0 "Traders believe that trade is beneficial to all parties and that the way to mutual prosperity is to increase trading ties with all parties which will also act to underpin our continued safety."
 cartel_civies:0 "Civilians"
 cartel_civies_influence:0 "Civilian Influence"
 cartel_civies_FACTION_DESC:0 "The residents of the location we operate out of. To ignore them would lead to more trouble than it's worth, and they have a vested interested in good relations and sensible governance."
 cartel_dealers:0 "Dealers"
 cartel_dealers_influence:0 "Dealers Influence"
 cartel_dealers_FACTION_DESC:0 "Our Dealers work to ensure that markets open and stay so. They are the wing most liable to volence and ensuring quotas through intimidation."
 cartel_smugglers:0 "Smugglers"
 cartel_smugglers_influence:0 "Smugglers Influence"
 cartel_smugglers_FACTION_DESC:0 "Our Smugglers know the best places to grease the wheels of trade and expand operations, at home or abroad."