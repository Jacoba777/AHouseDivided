 mission_01_stl_unite_the_heartland_title:0 "Unite The Heartland"
 mission_01_stl_unite_the_heartland_desc:0 "Our preparations for war are complete, and our nation yearns for new conquest. Let us strike while the iron is hot!"
 mission_01_stl_a_respectable_state_title:0 "A Respectable State"
 mission_01_stl_a_respectable_state_desc:0 "Our recent acquisitions have left us in a relatively unstable place, and rebels threaten to undo our hard work. We should stamp out any doubts of our control before pressing further."
 mission_01_stl_develop_springfield_title:0 "Develop Springfield"
 mission_01_stl_develop_springfield_desc:0 "With the foundations laid, it is time to invest in Springfield’s prosperity. Development here will shine across the prairie!"
 mission_01_stl_invade_bloomington_title:0 "Invade Bloomington"
 mission_01_stl_invade_bloomington_desc:0 "The fertile farmlands of Illinois lies to our east. We must strike quickly, before any rivals contest our claim to the valley."
 mission_01_stl_the_way_of_the_valley_title:0 "The Way Of The Valley"
 mission_01_stl_the_way_of_the_valley_desc:0 "The people of the valley may differ from us, but they can be brought into the fold. Let us show them a future aligned with our cause."
 mission_01_stl_sweep_the_valley_title:0 "Sweep The Valley"
 mission_01_stl_sweep_the_valley_desc:0 "With the cultural groundwork laid, it is time to finish our sweep. The valley shall be unified under our rule, from cornfield to courthouse."
 mission_01_stl_the_elephant_in_the_room_title:0 "The Elephant In The Room"
 mission_01_stl_the_elephant_in_the_room_desc:0 "We can no longer ignore the looming presence of Chicagoland. To truly lead the region, we must challenge the city at the heart of it all."
 mission_01_stl_the_fate_of_windy_city_title:0 "The Fate Of Windy City"
 mission_01_stl_the_fate_of_windy_city_desc:0 "The die is cast. With our armies advancing, we must decide the fate of the Windy City. Let us claim it, and let the world take note."
 mission_00_ksc_centralize_kansas_city_title:0 "Centralize Kansas City"
 mission_00_ksc_centralize_kansas_city_desc:0 "Our first task is to bring order to Kansas City itself. Only through unity at home can we command respect across the plains."
 mission_00_ksc_a_question_of_identity_title:0 "A Question Of Identity"
 mission_00_ksc_a_question_of_identity_desc:0 "The time has come to decide if our ambitions lie in Missouri or Kansas."
