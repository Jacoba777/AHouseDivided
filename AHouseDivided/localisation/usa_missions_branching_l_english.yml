 mission_ks_ksc_capture_topeka_title:0 "Capture Topeka"
 mission_ks_ksc_capture_topeka_desc:0 "Topeka holds the keys to Kansas’s political legacy. Its capture will cement our claim as the rightful leader of the state."
 mission_ks_ksc_administering_a_capital_title:0 "Administering A Capital"
 mission_ks_ksc_administering_a_capital_desc:0 "With Topeka under our governance, we can begin shaping a central authority worthy of the Kansas name."
 mission_ks_ksc_developing_the_frontier_title:0 "Developing The Frontier"
 mission_ks_ksc_developing_the_frontier_desc:0 "The western plains await settlers and progress. By developing these frontier lands, we secure Kansas’s future prosperity."
 mission_ks_ksc_im_going_to_wichita_title:0 "I'm Going To Wichita"
 mission_ks_ksc_im_going_to_wichita_desc:0 "Wichita must join our growing realm. With its conquest, the dream of a unified and modern Kansas will come within reach."