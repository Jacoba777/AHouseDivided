l_english:
 mission_branch_unknown_title:0 "Branching Mission"
 mission_branch_unknown_desc:0 "This mission is a placeholder. It will be replaced by new missions depending on the outcome of the previous mission, once it is completed."
 mission_00_stl_integrate_centralia_title:0 "Integrate Centralia"
 mission_00_stl_integrate_centralia_desc:0 "For too long, our people have found themselves split among several states. We should unite our disparate peoples under a common banner."
 mission_00_stl_a_question_of_identity_title:0 "A Question Of Identity"
 mission_00_stl_a_question_of_identity_desc:0 "The time has come to decide if our ambitions lie in Missouri or Illinois."
 mission_00_stl_control_the_boonslicks_title:0 "Control The Boonslicks"
 mission_00_stl_control_the_boonslicks_desc:0 "The Boonslick region is the key to central Missouri. By holding it, we bridge the gap between the hills and the heartland."
 mission_00_stl_administering_a_capital_title:0 "Administering A Capital"
 mission_00_stl_administering_a_capital_desc:0 "Establishing firm rule over Jefferson City and Columbia cements our transformation from a mountain stronghold to a governing state."
 mission_00_stl_towards_the_ozarks_title:0 "Towards The Ozarks"
 mission_00_stl_towards_the_ozarks_desc:0 "To the south, the hills beckon. Their resources and people will bolster our growing power."
 mission_00_stl_ozark_recognition_title:0 "Ozark Recognition"
 mission_00_stl_ozark_recognition_desc:0 "By embracing the culture of the Ozarks, we strengthen the bonds between north and south Missouri, uniting the hills and the plains."
 mission_00_stl_the_fate_of_springfield_title:0 "The Fate Of Springfield"
 mission_00_stl_the_fate_of_springfield_desc:0 "Control over Springfield secures our command of southern Missouri. Its fall marks the completion of our Ozark ambitions."
 mission_00_ksc_centralize_kansas_city_title:0 "Centralize Kansas City"
