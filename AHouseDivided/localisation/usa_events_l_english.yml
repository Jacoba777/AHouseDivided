 #Old Dominion Infighting
 flavor_usa.301.t:0 "Corrupting Influence"
 flavor_usa.301.desc:0 "Forcing these hicks to deal with internal affairs should assuage our citizens worries for now. But which backwater should we destabilize?"
 flavor_usa.311.t:0 "Market Competition"
 flavor_usa.311.desc:0 "Without the economy to support such constant strife, we should see more peace. Now which state should get such treatment?"
 flavor_usa.45.t:0 "Corrupting Influence"
 flavor_usa.45.desc:0 "We gotten word from more loyal administrators that bribes have been recieved to influencial peoples throughout our state, increasing the power in comparison to our central authority. We haven't been able to source it, but no doubt it was one of the carpetbagger yankeedoms at work!"
 flavor_usa.45.a:0 "Damned disloyal dogs wag their tail at anything that glitters!"
 flavor_usa.50.t:0 "Dixie Raid"
 flavor_usa.50.desc:0 "We've been raided overnight by those Dixiemen, it appears that people were slaughtered and property was destroyed, but the situation is recoverable. We must make a response to this situation. What will it be?"
 flavor_usa.50.a:0 "The party itself must be held responsible!"
 flavor_usa.50.b:0 "No doubt the government was involved!"
 flavor_usa.50.c:0 "We shan't make a mountain out of a molehill."
 flavor_usa.50.d:0 "All parties involved are guilty, give me each of their heads."
 flavor_usa.60.t:0 "Dixie Raid"
 flavor_usa.60.desc:0 "We've pillaged what is rightfully ours from these Yanks!"
 flavor_usa.60.a:0 "Even this was too good for them..."
 flavor_usa.70.t:0 "Demands"
 flavor_usa.70.desc:0 "The raiding party had made too much noise, causing the government to take notice and demand that we hand over the soldiers that did this. If we refuse, they intend to force an apology through war!"
 flavor_usa.70.a:0 "We have no choice but to betray our own..."
 flavor_usa.70.b:0 "This is outrageous! It's unfair!"
 flavor_usa.80.t:0 "Demands"
 flavor_usa.80.desc:0 "The raiding party had made too much noise, causing the government to take notice. They insist that our leadership was the mastermind, and demand that we hand over our top minister to them! If we refuse, they intend to force an apology through war!"
 flavor_usa.80.a:0 "We have no choice but to betray our own..."
 flavor_usa.80.b:0 "This is outrageous! It's unfair!"
 flavor_usa.90.t:0 "Demands"
 flavor_usa.90.desc:0 "The raiding party had made too much noise, causing the government to take notice. The ruler personally came to demand that all those involved be handed over or executed in front of them immediately. Refusal would be inviting war..."
 flavor_usa.90.a:0 "To be made a pariah state is no goal of mine."
 flavor_usa.90.b:0 "This is outrageous! It's unfair!"
 flavor_usa.1865.t:0 "Dixie Destabilization"
 flavor_usa.1865.desc:0 "We have two options in front of us that would be limited enough in scope to prevent backlash. We can either pay off some more 'open-minded' people within the country, or prevent their merchant from doing business in our markets for some time. Which would you prefer?"
 flavor_usa.1865.a:0 "Let us use our economic might to trip them."
 flavor_usa.1865.b:0 "Our pockets run deep and their rich don't know humility."
 estate_nobles_dixie_conquest:0 "Conquer Our Rightful Lands"
 estate_nobles_dixie_conquest_desc:0 "These Yanks have been sitting on our land for far too long. We must liberate it from them!"
 estate_nobles_vassalise_dixie8:0 "Subjugate a Troublemaker"
 estate_nobles_vassalise_dixie_desc:0 "These people have been a pebble in our shoe for far too long. It is time that we eliminated their leadership and replaced it with a friendlier one."
 raid_punished:0 "Weakened Recruitment"
 dixie_embargoed:0 "Cost of Doing Business"
 dixie_corruption:0 "Cost of Corruption"
 new_south_trade_disruption:0 "Damaged Trade"
 new_south_corruption:0 "Greedy Estates"
 dixie_recent_raid:0 "Recently Raided"
 flavor_usa.001.t:0 "Government Collapse"
 flavor_usa.001.desc:0 "We have just recieved word that the Confederal Congress, the final bastion of Southern Liberty, had last night been burned with all electors inside! With their passing so too does the Confederation that lasted so through so much..."
 flavor_usa.001.a:0 "By Gods Grace, may we survive this trial..."
 flavor_usa.001.b:0 "An illegimate power removed, but at what cost..?"