 flavor_xca.110.t:0 "Oklahoma or Red Skins?"
 flavor_xca.110.desc:0 "The past of the American government contains moments of great national shame, chief among them is the treatment towards the natives. Among our recent conquests is portions of the former state of Oklahoma, whose local tribal leaders have asked us to allow them self rule separate from the historic state. Oklahomans, however, have requested that we keep their state united."
 flavor_xca.110.a:0 "The Indian Territory should have been kept distinct."
 flavor_xca.110.b:0 "We cannot right wrongs of the past by taking from those present now."
 flavor_xca.2110.d:0 "They stand equal with the rest of our empire, and yet they ask for more?!"
