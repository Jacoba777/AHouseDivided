 vancouver_corporate_fear:0 "Corporate Overreach"
 desc_vancouver_corporate_fear:0 "Our economic alignment with the Vancouver Corporation has created a dependency that could be exploited by our adversaries. To survive is to distrust those that claim to help."
 integrate_vc_notif:0 "The Market ensures our prosperity!"
 vancouver_dependency_title:0 "Economic Dependency"
 vancouver_dependency_desc:0 "Our economic alignment with the Vancouver Corporation has created a dependency that could be exploited by our adversaries. To survive is to distrust those that claim to help."
 vancouver_dependency_long_desc:0 "Our economic alignment with the Vancouver Corporation has created a dependency that could be exploited by our adversaries. To survive is to distrust those that claim to help.\n\nWhile the corporation's support has been instrumental in our growth, it has also made us vulnerable to external manipulation. We must remain vigilant and cautious in our dealings with them, as their interests may not always align with ours."
 vancouver_dependency_is_our:0 "Economic Dependent"
 vancouver_dependency_title_plural:0 "Economic Dependencies"
 VANCOUVER_DISMANTLEMENT_WAR_NAME:0 "Sherman Anti-Trust War"
 cb_dissolve_vancouver:0 "Dismantle the Vancouver Corporation"
 cb_dissolve_vancouver_desc:0 "The Vancouver Corporation has become too powerful and influential, posing a threat to our sovereignty and economic independence. Though the US Government no longer holds influence here we still can utilize the Anti-Trust Act of 1890."
 dismantle_vancouver_corporation:0 "Dissolve Vancouver Corporation."
 dismantle_vancouver_corporation_desc:0 "The Vancouver Corporation has become too powerful and influential, posing a threat to our sovereignty and economic independence. We must take decisive action to dismantle this corporate behemoth and restore control over our own affairs."
 vc_response_grace:0 "We graciously accept the offer."
 vc_response_malice:0 "We would be fools to refuse such an offer."
 vancouver_corporation_investing:0 "Vancouver Corporation Investing"
 vancouver_corporate_dependency:0 "Economically Aligned Market"
 vancouver_integrated_market:0 "Economically Integrated Market"
 assume_vancouver_corporation_title:0 "Vancouver Corporation Reborn"
 assume_vancouver_corporation_desc:0 "Dissolved and restructured under government oversight, the Vancouver Corporation stands as a beneficial part of the regional economy. Recently they have been approaching our government with proposals for investment opportunities. Shall we hear the proposal?"
 po_vancouver_dissolution:0 "Dissolve the Corporation"
 po_vancouver_dissolution_desc:0 "Dissolve the Vancouver Corporation and end its influence."
 CB_ALLOWED_po_vancouver_dissolution:0 "The Vancouver Corporation has proven itself a parasite to regional stability and prosperity, and must be dissolved."
 PEACE_po_vancouver_dissolution:0 "Corporate Dissolution"
 flavor_usa.185250.t:0 "THE CORPORATE DIRECTORATE DISBANDED"
 flavor_usa.185250.desc:0 "Acting under the authority of the victorious powers, the Vancouver Corporation has been formally dissolved. Its monopolies are dismantled, its financial instruments seized, and its influence extinguished. The economic institutions of the state are to be reorganized under new direction incorporating civilian oversight."
 vc_dissolution_notif:0 "An end to an era, and the beginning of a new one."
 flavor_usa.185251.t:0 "Petition for Reinstatement"
 flavor_usa.185251.desc:0 "Following a prolonged period of structural reform and strategic realignment, representatives of the Vancouver Corporation have formally petitioned for renewed operational status within our jurisdiction.\n\nOver the past decade, the organization has maintained a discreet presence through investment vehicles, commercial partnerships, and policy consultation forums. These initiatives, initially informal, now form the foundation of a comprehensive proposal for regulated reintegration.\n\nThe Corporation concedes that prior leadership exceeded its mandate. Governance frameworks have since been rewritten, compliance mechanisms institutionalized, and executive authority curtailed. Their stated objective is limited to economic coordination, infrastructural development, and administrative efficiency under explicit state oversight.\n\nThe groundwork, it appears, has already been laid.\n\nThe question before us is whether to formalize what has quietly taken shape."
 vc_reestablished_notif:0 "Authorize the revised charter and formalize their return."


#LA Empire
 form_louisiana_empire_title:0 "Proclaim the Louisiana Empire"
 form_louisiana_empire_desc:0 "Started as a French colonial project, through its incorporation into the American Republic, the rivers of the Mississippi basin stood as the greatest means of inland travel anywhere on the planet. We, the people resting at it mouth have stayed influencial, but have supplanted by those that took advantage of our weakness. With this proclamation we seek to reclaim our rightful place as the beating heart of the continent, and to lead our people into a new era of prosperity and strength."
 louisiana_empire_reform:0 "Louisiana Empire"
 louisiana_empire_reform_desc:0 "Representing Louisiana's desire for regaining her mercantile influence over the Mississippi river basin, the Louisiana Empire grants strong bonuses when controlling the banks of her navigable tributaries, but lacks interest in directly controlling else."
