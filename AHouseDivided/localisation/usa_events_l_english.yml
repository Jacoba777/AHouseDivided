l_english:
 flavor_usa.1.title:0 "Blue Crab Boom"
 flavor_usa.1.desc:0 "As our influence across the Chesapeake expands, so does our control of the valuable blue crab fishing industry. This year, we have experienced harvests never before seen, bringing countless crustaceans to our docks and warehouses. There are many options we can take with our newfound abundance."
 flavor_usa.1.a:0 "We should sell the surplus abroad!"
 flavor_usa.1.b:0 "Let's slap some Old Bay on them and distribute them to our people!"
 flavor_usa.2.title:0 "A Maryland Monarchy?"
 flavor_usa.2.desc:0 "Forming Maryland has given us an opportunity to reconsider our form of government. Many of our cities and counties are named after the English monarchy, which features prominently in our history as well. This has lead some to propose we make $MONARCH$ a monarch."
 flavor_usa.2.a:0 "Crown [Root.Monarch.GetName]. Long may [Root.Monarch.GetSheHe] reign!"
 flavor_usa.2.b:0 "Don't be ridiculous, Maryland should remain a [Root.GovernmentName]."
 flavor_usa.3.title:0 "A Strongman Pretender's Plot Uncovered"
 flavor_usa.3.desc:0 "With [Root.Monarch.GetName]'s leadership still in its infancy, we have uncovered a plot by an Oligarch-backed strongman to seize control of the state for himself. We do not know exactly who his co-conspirators are, but an agressive and expensive purge of our military is in order if we seek to root this out before they have time to organize."
 flavor_usa.3.a:0 "Let's smother this coup in its crib."
 flavor_usa.3.b:0 "We shouldn't legitimize this pretender with a heavy-handed response."
 usa_mission_events.1.title:0 "A Question of Identity"
 usa_mission_events.1.desc:0 "It has been taken for granted that St Louis is a Missourian city. However, our considerable holdings in formerly Illinoisan land has led some to question what our future should be. As things stand, we are viewed primarily as Missourian rather than Illinoisan, and our administrators are working diligently to legitimize claims further west. However, should we move our capital to East St Louis, across the Mississippi, we could more readily target our ambitions towards hegemony over Illinois. Should we listen to these mavericks?"
 usa_mission_events.1.a:0 "Let's not entertain these delusions, St Louis is clearly Missourian."
 usa_mission_events.1.b:0 "Our future is one east of the Mississippi. Onward, to the heart of Illinois!"
 usa_mission_events.2.title:0 "A Question of Identity"
 usa_mission_events.2.desc:0 "While Kansas City shares a name with the former state of Kansas, the city was historically Missourian. However, in present times, Kansas City finds itself largely separated from either former state. This has led some to question if we ought to revisit our long-term ambitions. Should we seek to claim the title as the true successor state of Missouri, as our history demands of us? Or will we seek to one day drop the 'city' from our name, and reform the sunflower state who shares our namesake?"
 usa_mission_events.2.a:0 "We are a Missourian people, and a united Missouri we shall strive to be!"
 usa_mission_events.2.b:0 "I'll be deep in the cold cold ground before I recognize Missouri."
 flavor_xca.100.t:0 "Organizing Alaska"
 flavor_xca.100.desc:0 "We have conquered our way into the Alaskan lands, and begun to administer her people. There are those amongst them who have pressed for the American right to self determination, and thus the right to self governance under our banner. What should be done?"
 flavor_xca.100.a:0 "We shall reorganize the historic Department of Alaska!"
 flavor_xca.210.d:0 "They stand equal with the rest of our empire, and yet they ask for more?!"
