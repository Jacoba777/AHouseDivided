 #Old Dominion Infighting
 flavor_usa.301.t:0 "Corrupting Influence"
 flavor_usa.301.desc:0 "Forcing these hicks to deal with internal affairs should assuage our citizens worries for now. But which backwater should we destabilize?"
 flavor_usa.311.t:0 "Market Competition"
 flavor_usa.311.desc:0 "Without the economy to support such constant strife, we should see more peace. Now which state should get such treatment?"
 flavor_usa.45.t:0 "Corrupting Influence"
 flavor_usa.45.desc:0 "We gotten word from more loyal administrators that bribes have been recieved to influencial peoples throughout our state, increasing the power in comparison to our central authority. We haven't been able to source it, but no doubt it was one of the carpetbagger yankeedoms at work!"
 flavor_usa.45.a:0 "Damned disloyal dogs wag their tail at anything that glitters!"
 flavor_usa.50.t:0 "Dixie Raid"
 flavor_usa.50.desc:0 "We've been raided overnight by those Dixiemen, it appears that people were slaughtered and property was destroyed, but the situation is recoverable. We must make a response to this situation. What will it be?"
 flavor_usa.50.a:0 "The party itself must be held responsible!"
 flavor_usa.50.b:0 "No doubt the government was involved!"
 flavor_usa.50.c:0 "We shan't make a mountain out of a molehill."
 flavor_usa.50.d:0 "All parties involved are guilty, give me each of their heads."
 flavor_usa.60.t:0 "Dixie Raid"
 flavor_usa.60.desc:0 "We've pillaged what is rightfully ours from these Yanks!"
 flavor_usa.60.a:0 "Even this was too good for them..."
 flavor_usa.70.t:0 "Demands"
 flavor_usa.70.desc:0 "The raiding party had made too much noise, causing the government to take notice and demand that we hand over the soldiers that did this. If we refuse, they intend to force an apology through war!"
 flavor_usa.70.a:0 "We have no choice but to betray our own..."
 flavor_usa.70.b:0 "This is outrageous! It's unfair!"
 flavor_usa.80.t:0 "Demands"
 flavor_usa.80.desc:0 "The raiding party had made too much noise, causing the government to take notice. They insist that our leadership was the mastermind, and demand that we hand over our top minister to them! If we refuse, they intend to force an apology through war!"
 flavor_usa.80.a:0 "We have no choice but to betray our own..."
 flavor_usa.80.b:0 "This is outrageous! It's unfair!"
 flavor_usa.90.t:0 "Demands"
 flavor_usa.90.desc:0 "The raiding party had made too much noise, causing the government to take notice. The ruler personally came to demand that all those involved be handed over or executed in front of them immediately. Refusal would be inviting war..."
 flavor_usa.90.a:0 "To be made a pariah state is no goal of mine."
 flavor_usa.90.b:0 "This is outrageous! It's unfair!"
 flavor_usa.1865.t:0 "Dixie Destabilization"
 flavor_usa.1865.desc:0 "We have two options in front of us that would be limited enough in scope to prevent backlash. We can either pay off some more 'open-minded' people within the country, or prevent their merchant from doing business in our markets for some time. Which would you prefer?"
 flavor_usa.1865.a:0 "Let us use our economic might to trip them."
 flavor_usa.1865.b:0 "Our pockets run deep and their rich don't know humility."
 estate_nobles_dixie_conquest:0 "Conquer Our Rightful Lands"
 estate_nobles_dixie_conquest_desc:0 "These Yanks have been sitting on our land for far too long. We must liberate it from them!"
 estate_nobles_vassalise_dixie8:0 "Subjugate a Troublemaker"
 estate_nobles_vassalise_dixie_desc:0 "These people have been a pebble in our shoe for far too long. It is time that we eliminated their leadership and replaced it with a friendlier one."
 raid_punished:0 "Weakened Recruitment"
 dixie_embargoed:0 "Cost of Doing Business"
 dixie_corruption:0 "Cost of Corruption"
 new_south_trade_disruption:0 "Damaged Trade"
 new_south_corruption:0 "Greedy Estates"
 dixie_recent_raid:0 "Recently Raided"
 flavor_usa.1102.t:0 "Government Collapse"
 flavor_usa.1102.desc:0 "We have just recieved word that the Confederal Congress, the final bastion of Southern Liberty, had last night been burned with all electors inside! With their passing so too does the Confederation that lasted so through so much..."
 flavor_usa.1102.a:0 "By Gods Grace, may we survive this trial..."
 flavor_usa.1102.b:0 "An illegitimate power removed, but by whose hand..?"
 flavor_usa.1101.t:0 "Government Reformation"
 flavor_usa.1101.desc:0 "News came early morning that the Confederal Constitutional Convention had submitted their draft proposal in secret to the Congress, and that it has been successfully ratified!"
 flavor_usa.1101.a:0 "One Nation, Under God, Indivisible!"
 flavor_usa.1101.b:0 "Just when they were at death's door too..."
#American Desert Expansion (well really anything not yet touched by expansions excluding the hre)
 #OKLAHOMA
 flavor_usa.46.t:0 "The Syndicates Convene"
 flavor_usa.46.d:0 "We're received word that the current state of factional dominance is causing unease within other major factions. As such, the Syndicate Council has been convened to resolve the issue, but they require your approval before acting. What is the position of the state?"
 flavor_usa.46.a:0 "Our support stands unwavering with the Frontiersmen!"
 flavor_usa.46.b:0 "Our support stands unwavering with the Miltias!"
 flavor_usa.46.c:0 "Our support stands unwavering with our Traders!"
 flavor_usa.46.d:0 "We shall change our support to the Militias!"
 flavor_usa.46.e:0 "We shall change our support to the Frontiersmen!"
 flavor_usa.46.f:0 "We shall change our support to the Traders!"


 #Vancouver Corporation
 vc_initial_invest_title:0 "New Potential Markets"
 vc_initial_invest_desc:0 "The corporation has identified new markets avaiable for investment, but as it has publicly sworn off politics, it is offically up to the head of state to take the opportunity. Shall we be given the okay to go forward?"
 vc_up_to_tributary_title:0  "Investment Returns"
 vc_up_to_tributary_desc:0 "Initial Investments have paid off, shall we use the reach of the corporation to ensure that we begin seeing profits sent via the local leaders? We are ready to begin, just give us the word."
 vc_tributary_to_appanage_title:0 "Market Integration"
 vc_tributary_to_appanage_desc:0 "With the corporation's influence largely aligning our economies and introducing economic strain, should we leverage our influence to help our neighbor more easily trade and access our market? This will be swift, we simply need to give the order to begin."
 vc_full_integration_title:0 "Political Integration"
 vc_full_integration_desc:0 "Local leaders stand as a hinderance, attempting to keep their populace and market as separated from us as possible. There is no lack of ability to have them removed, but should we take the step to do so and fully integrate the region into our state? This will be likely to make adversaries, yet our clerks need only get a signature to make it happen."
 flavor_usa.185190.t:0 "Proposal for Strategic Investment"
 flavor_usa.185190.desc:0 "Our analysts have identified promising growth conditions within a neighboring state.\nThrough strategic capital deployment and partnership initiatives, we can help modernize their economic landscape while securing long-term value for our stakeholders.\n\nWith careful stewardship, this relationship will ensure stability, efficiency, and mutually beneficial returns."
 vc_corp_invest_self:0 "Investments are Approved"
 flavor_usa.1851902.t:0 "Proposal for Strategic Investment"
 flavor_usa.1851902.desc:0 "Representatives of the Vancouver Corporation have notified our administration of structured investment and development support.\n\nTheir proposal outlines infrastructure modernization, capital infusion, and expanded access to regional markets.\n\nParticipation would place select sectors of our economy under external oversight — in exchange for liquidity and stability."
 vc_corp_invest_target:0 "These investments have been noted."
 flavor_usa.185180.t:0 "Proposal for Economic Partnership"
 flavor_usa.185180.desc:0 "Following a period of successful engagement, one of our investing markets has agreed to deepen its economic alignment with our enterprise.\n\nThis formal partnership will streamline administrative processes, optimize resource flows, and ensure reliable oversight of critical industries.\n\nTheir prosperity is now inseparable from ours."
 vc_corp_trib_self:0 "Formalize our Economic Partnership"
 flavor_usa.1851802.t:0 "Proposal for Economic Partnership"
 flavor_usa.1851802.desc:0 "Following ongoing commercial engagement, the Vancouver Corporation has proposed a formalized economic partnership.\n\nThis agreement would institutionalize revenue contributions and policy coordination under their broader regional framework.\n\nWhile our sovereignty would remain intact in principle, key fiscal instruments would operate under shared oversight."
 flavor_usa.185100.t:0 "Aligning Markets for Mutual Growth"
 flavor_usa.185100.desc:0 "To unlock the full potential of our regional framework, we will initiate comprehensive market integration with our local partners.\n\nCentralized coordination will eliminate inefficiencies, harmonize production targets, and align labor outputs with strategic objectives.\n\nIntegration ensures clarity. Clarity ensures growth." 
 corp_invest_notif:0 "Excellent Work!"
 flavor_usa.185101.t:0 "Integrating Markets for Mutual Growth"
 flavor_usa.185101.desc:0 "The Vancouver Corporation has presented a comprehensive integration framework designed to harmonize our economic output with their internal system.\n\nAdministrative authority would be streamlined, and production targets standardized to maximize efficiency.\n\nThis would significantly reduce independent fiscal discretion in exchange for guaranteed market access."
 flavor_usa.185200.t:0 "Consolidating Markets for Operational Excellence"
 flavor_usa.185200.desc:0 "In pursuit of operational excellence and long-term stability, the former administrative structures have been consolidated into our internal market system.\n\nUnified governance allows us to allocate resources with precision, reduce redundancies, and deliver consistent performance across all territories.\n\nConsolidation is not an end — it is an optimization."
 vc_pick_1_annex_name:0 "Integrate [vc_pick_1_annex.GetName] into our Economic Framework"
 vc_pick_2_annex_name:0 "Integrate [vc_pick_2_annex.GetName] into our Economic Framework"
 vc_pick_3_annex_name:0 "Integrate [vc_pick_3_annex.GetName] into our Economic Framework"
