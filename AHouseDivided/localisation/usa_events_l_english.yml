 dredge_the_rivers:0 "Dredge the Rivers"
 dredge_the_rivers_desc:0 "The Mississippi River is the lifeblood of our economy, and the key to our influence over the continent. By investing in dredging operations, we can increase our control over the river, allowing us to exert more influence over the surrounding regions and trade routes. This will not only boost our economy but also strengthen our position as a dominant power in the region."
 increase_our_tariffs:0 "Increase Our Tariffs"
 increase_our_tariffs_desc:0 "By increasing tariffs on goods coming from outside our borders, we can encourage vastly increase our revenue for a short burst. Undoubtedly this will lead to infuration from others in the region leading to long term suppressed revenue, however."
 fortify_the_river:0 "Fortify the River"
 fortify_the_river_desc:0 "The rivers of the region allow unfettered access to anywhere in the basin, a boon in peace, but a curse in war. We shall build our defenses and utilize our strengths to give ourselves the best chance to hold the river against any who would seek to take it from us."
 ability_la_river_authority_mechanic:0 "Mississippi Basin Influence"


 # Mississippi Basin Rivers Explanations
 check_la_basin_control_title:0 "What is the Mississippi Basin?"
 check_la_basin_control_desc:0 "The Mississippi Basin has a multitude of rivers and tributaries, multiple of which are navigable and where use historically by colonial powers and Americans. This decision helps give a layout of the system and a listing of the tributaries that offer Basin Influence when controlled."
 flavor_usa.1218.t:0 "The Cumberland River"
 flavor_usa.1218.desc:0 "Rising in the mountains of eastern Kentucky, the Cumberland River flows through Nashville, Tennessee, before turning northwest toward the Ohio Valley. It joins the Ohio River near Smithland, Kentucky, providing a vital route between the Appalachian interior and the Mississippi Basin."
 flavor_usa.1218.a:0 "I see."
 flavor_usa.1217.t:0 "The Tennessee River"
 flavor_usa.1217.desc:0 "Rising in the mountains of eastern Kentucky, the Cumberland River flows through Nashville, Tennessee, before turning northwest toward the Ohio Valley. It joins the Ohio River near Smithland, Kentucky, providing a vital route between the Appalachian interior and the Mississippi Basin."
 flavor_usa.1217.a:0 "I see."
 flavor_usa.1223.t:0 "The Wabash River"
 flavor_usa.1223.desc:0 "The Wabash River drains the fertile plains of Indiana and eastern Illinois. Flowing south past Lafayette and Terre Haute, it forms part of the historic frontier before joining the Ohio River near Mount Vernon, Indiana."
 flavor_usa.1223.a:0 "I see."
 flavor_usa.1222.t:0 "The Green River"
 flavor_usa.1222.desc:0 "Rising in central Kentucky, the Green River flows west past Bowling Green and through the limestone country of Mammoth Cave before joining the Ohio River near Evansville, Indiana."
 flavor_usa.1222.a:0 "I see."
 flavor_usa.1221.t:0 "The Kentucky River"
 flavor_usa.1221.desc:0 "The Kentucky River flows through the heart of the Bluegrass region, passing the historic capital of Frankfort, Kentucky, before joining the Ohio River at Carrollton. Its winding course made it a vital route through central Kentucky."
 flavor_usa.1221.a:0 "I see."
 flavor_usa.1220.t:0 "The Kanawha River"
 flavor_usa.1220.desc:0 "The Kanawha River drains the Appalachian coalfields of western Virginia. Formed by the New and Gauley Rivers near Charleston, it flows northwest before joining the Ohio River at Point Pleasant, West Virginia."
 flavor_usa.1220.a:0 "I see."
 flavor_usa.1204.t:0 "The Ohio River"
 flavor_usa.1204.desc:0 "The Ohio River forms the great eastern gateway to the Mississippi Basin. It begins at Pittsburgh, Pennsylvania, where the Allegheny and Monongahela Rivers meet, and flows west past Cincinnati and Louisville before joining the Mississippi River at Cairo, Illinois. Control of the Ohio grants access to the industrial heartlands of the eastern interior."
 flavor_usa.1204.a:0 "I see."
 flavor_usa.1203.t:0 "The Missouri River"
 flavor_usa.1203.desc:0 "The Missouri River is the longest tributary of the Mississippi system. Rising in the Rocky Mountains of Montana, it flows across the northern plains past Fort Benton, Bismarck, Omaha, and Kansas City before joining the Mississippi River at St. Louis, Missouri.\n\nWithin the River Authority system, this river is represented by sections reflecting the Upper and Lower Missouri where it confluences with the Platte River near Omaha, Nebraska."
 flavor_usa.1203.a:0 "I see."
 flavor_usa.1202.t:0 "The Mississippi River"
 flavor_usa.1202.desc:0 "The Mississippi River forms the central artery of the North American interior. Rising among the lakes of northern Minnesota, it flows south past Minneapolis, St. Louis, Memphis, and Baton Rouge before emptying into the Gulf of Mexico at New Orleans.\n\nAt St. Louis the Mississippi is joined by the Missouri River, linking the trade routes of the Great Plains with the Mississippi Basin. It is at this point, where for the sake of gameplay, the river has been separated into upper and lower sections."
 flavor_usa.1202.a:0 "I see."
 flavor_usa.1213.t:0 "The Arkansas River"
 flavor_usa.1213.desc:0 "The Arkansas River flows east across the southern plains before entering the Mississippi Basin. Its navigation historically extended inland to Fort Smith, Arkansas, where the river descends from the Ozark foothills. From there it winds southeast through the Arkansas Delta before joining the Mississippi River near Arkansas Post, south of Little Rock."
 flavor_usa.1213.a:0 "I see."
 flavor_usa.1212.t:0 "The Ouachita River"
 flavor_usa.1212.desc:0 "The Ouachita River rises in the Ouachita Mountains of western Arkansas and flows south past Camden and Monroe before joining the Black and Red River system in northeastern Louisiana, ultimately feeding the Mississippi River."
 flavor_usa.1212.a:0 "I see."
 flavor_usa.1210.t:0 "The Illinois River"
 flavor_usa.1210.desc:0 "The Illinois River links the Mississippi Basin with the Great Lakes region. Flowing southwest from the Chicago area past Peoria, it joins the Mississippi River at Grafton, Illinois.\n\nThe Illinois and Michigan Canal, built in the nineteenth century, connected this river to Lake Michigan, creating a continuous water route between the Great Lakes and the Mississippi system."
 flavor_usa.1210.a:0 "I see."
 flavor_usa.1209.t:0 "The Wisconsin River"
 flavor_usa.1209.desc:0 "The Wisconsin River flows south through the forests and bluffs of central Wisconsin. Navigation historically extended to Portage, Wisconsin, where the river nearly meets the Fox River. From there it runs southwest past Wisconsin Dells before joining the Mississippi River at Prairie du Chien."
 flavor_usa.1209.a:0 "I see."
 flavor_usa.1208.t:0 "The Minnesota River"
 flavor_usa.1208.desc:0 "The Minnesota River flows eastward across southern Minnesota from the plains near Traverse County before joining the Mississippi River at St. Paul–Minneapolis. It historically served as an important inland route connecting the prairies with the upper Mississippi trade network."
 flavor_usa.1208.a:0 "I see."
 flavor_usa.1216.t:0 "Ohio's Major Tributaries"
 flavor_usa.1216.desc:0 "The Ohio River has two large tributaries, each important to their own portion of the basin. Mechanically the Tennessee and Cumberland Rivers are represented."
 flavor_usa.1216.a:0 "The Tennessee River."
 flavor_usa.1216.b:0 "The Cumberland River."
 flavor_usa.1216.c:0 "Nevermind."
 flavor_usa.1219.t:0 "Ohio's Minor Tributaries"
 flavor_usa.1219.desc:0 "The Ohio River has several smaller tributaries that contribute to its flow. Mechanically the Kanawha, Kentucky, Green, and Wabash Rivers are represented."
 flavor_usa.1219.a:0 "The Kanawha River."
 flavor_usa.1219.b:0 "The Kentucky River."
 flavor_usa.1219.c:0 "The Green River."
 flavor_usa.1219.d:0 "The Wabash River."
 flavor_usa.1219.e:0 "Nevermind."
 flavor_usa.1207.t:0 "Mississippi's Upper Tributaries"
 flavor_usa.1207.desc:0 "The Mississippi River has several 'lesser' tributaries that contribute to its flow. Mechanically the Minnesota, Wisconsin, and Illinois Rivers are represented."
 flavor_usa.1207.a:0 "The Minnesota River."
 flavor_usa.1207.b:0 "The Wisconsin River."
 flavor_usa.1207.c:0 "The Illinois River."
 flavor_usa.1207.d:0 "Nevermind."
 flavor_usa.1211.t:0 "Mississippi's Lower Tributaries"
 flavor_usa.1211.desc:0 "The lower Mississippi has two tributaries represented mechanically, the Arkansas and Ouachita Rivers."
 flavor_usa.1211.a:0 "The Ouachita River."
 flavor_usa.1211.b:0 "The Arkansas River."
 flavor_usa.1211.c:0 "Nevermind."
 flavor_usa.1215.t:0 "Ohio's Major/Minor Tributaries"
 flavor_usa.1215.desc:0 "Would you like to see the major or minor tributaries of the Ohio River?"
 flavor_usa.1215.a:0 "Her Major Tributaries."
 flavor_usa.1215.b:0 "Her Minor Tributaries."
 flavor_usa.1215.c:0 "Nevermind."
 flavor_usa.1214.t:0 "Missouri's Major/Minor Tributaries"
 flavor_usa.1214.desc:0 "No navigable tributaries exist for the Missouri River."
 flavor_usa.1214.c:0 "Nevermind."
 flavor_usa.1206.t:0 "Mississippi's Major/Minor Tributaries"
 flavor_usa.1206.desc:0 "Would you like to see the major or minor tributaries of the Mississippi River?"
 flavor_usa.1206.a:0 "Her Major Tributaries."
 flavor_usa.1206.b:0 "Her Minor Tributaries."
 flavor_usa.1206.c:0 "Nevermind."
 flavor_usa.1205.t:0 "Mississippi Tributaries System"
 flavor_usa.1205.desc:0 "The Mississippi Basin has a multitude of rivers and tributaries, multiple of which are navigable and where use historically by colonial powers and Americans. Tributaries have been broken up by their respective major river for ease of navigation. Is there a specific river system you would like to see the tributaries of?"
 flavor_usa.1205.a:0 "Mississippi River Tributaries."
 flavor_usa.1205.b:0 "Missouri River Tributaries."
 flavor_usa.1205.c:0 "Ohio River Tributaries."
 flavor_usa.1205.d:0 "Nevermind."
 flavor_usa.1201.t:0 "Mississippi Tributaries System"
 flavor_usa.1201.desc:0 "The Mississippi Basin has three major arteries, the Mississippi, Missouri, and Ohio Rivers. Each of these rivers has its own network of navigable tributaries that provide access to different regions of the basin. Which would you like to explore?"
 flavor_usa.1201.a:0 "The Mississippi River."
 flavor_usa.1201.b:0 "The Missouri River."
 flavor_usa.1201.c:0 "The Ohio River."
 flavor_usa.1201.d:0 "Nevermind."
 flavor_usa.1200.t:0 "Mississippi Tributaries System"
 flavor_usa.1200.desc:0 "The Mississippi Basin is a complex system of rivers and tributaries, with the Mississippi, Missouri, and Ohio being the major arteries. Each of these rivers has its own network of navigable tributaries that provide access to different regions of the basin."
 flavor_usa.1200.a:0 "What are the major rivers?"
 flavor_usa.1200.b:0 "What are the tributaries?"
 flavor_usa.1200.c:0 "Nevermind."
 flavor_usa.1224.t:0 "Undesired Provinces"
 flavor_usa.1224.desc:0 "Fun fact: All counties are unwanted by the same degree, but there is no demerit to having a vassal hold them in your stead!"
 flavor_usa.1224.a:0 "Understood."
 check_la_unwanted_provinces_title:0 "Highlight Unwanted Counties"
 check_la_unwanted_provinces_desc:0 "This decision exists to allow players to see which counties they have that are providing the 'Unwanted Province' penalty, and has no effects."

#generic stuff
 manifesting_destiny:0 "Manifesting Destiny"
 form_aztlan_title:0 "Form Aztlan"
 form_aztlan_desc:0 "The marks and traits of the Natives and later Mexican people never left these lands, and now they stand united once again without the Americans to rule over them. If there were ever a chance to form a new nation for the Hispanophones, It is now."

#midwestern Items
 flavor_usa.1300.t:0 "The Fall of Kansas City"
 flavor_usa.1300.desc:0 "News has arrived that Kansas City, which stood as the frontier city shouldering much of the attacks from the plains people, unexpectedly fell. Whether this was a happenstance or a sign of things to come remains to be seen."
 flavor_usa.1300.a:0 "A gem in the crown for our burgening Empire!"
 flavor_usa.1300.b:0 "The backwaters have only succeeded in taking the frontier city..."
 horde_jubilation:0 "Horde Victory"
 desc_horde_jubilation:0 "The Frontier City, a bastion of the settled east, has fallen to the hordes and the people are celebrating their victory. We stand emboldened and a becon to the greater plainspeople."
 midwestern_disarray:0 "Midwest Disarray"
 desc_midwestern_disarray:0 "Caught by surprise with the fall of the frontier city, the Midwest is experiencing an economic shock, slightly worsened by the renewed heavy investments into their defenses."
 flavor_usa.1400.t:0 "Creation of the Monetary Union"
 flavor_usa.1400.desc:0 "In an effort to further integrate the regional economies trading with us, we have established a central bank and common currency, alongside a free trade area."
 flavor_usa.1400.a:0 "This will be a boon to our economy!"
 flavor_usa.1403.t:0 "We have violated the Chicagoan Compact."
 flavor_usa.1403.desc:0 "The Chicagoan Compact, a treaty signed between us and the Midwestern states, has been violated by our recent actions. Our people as well as foreign powers will be furious with our government when they learn of us risking their prosperity."
 flavor_usa.1403.a:0 "We shall make prosperity on our terms!"
 flavor_usa.1404.t:0 "Compact Enforcement"
 flavor_usa.1404.desc:0 "The Midwest went through great lengths and many lives to first establish the Chicagoan Compact, and has now again enforced it upon one try to flout it. The ramifications of this is be felt throughout the region, and for generations to come."
 flavor_usa.1404.a:0 "For Life, Liberty, and the Pursuit of Prosperity!"
 flavor_usa.1405.t:0 "Minneapolis Hegemony"
 flavor_usa.1405.desc:0 "Minneapolis stands unique in the Midwest as the only city that failed to fully unite before the establishment of the Chicagoan Compact, and has such has been the seat of heated trade wars between Minneapolis proper and St. Paul. Fairbault is the last independent city in the region, and has successfully played the sides off of each other to maintain its independence. But this can no longer stand, one side must be chosen."
 flavor_usa.1405.a:0 "The Minneapolis market is the larger market."
 flavor_usa.1405.b:0 "The St. Paul market will prove more lucrative in time."
 flavor_usa.1405.c:0 "We do not bend to tyrants!"
 flavor_usa.1406.t:0 "The Fairbault War"
 flavor_usa.1406.desc:0 "Fairbault, the last independent city in the Minneapolis region, sparked the first conflict since the Compact's ratification. It stayed small and peripheral, so was allowed to resolve itself."
 flavor_usa.1406.a:0 "We desire only fairbault."
 flavor_usa.1406.b:0 "We shall unite the Minneapolis region."
 flavor_usa.1406.c:0 "We desire only fairbault."
 flavor_usa.1406.d:0 "We shall unite the Minneapolis region."
 flavor_usa.1406.e:0 "We have bided our time and earned our place as head of the region!"
#American Desert Disaster Events
 trade_collapse.1.t:0 "Markets Go Informal"
 trade_collapse.1.desc:0 "As confidence in central regulation falters, traders increasingly turn to informal networks, avoiding official taxation and oversight."
 trade_collapse.1.a:0 "Crack down on illicit trade"
 trade_collapse.1.b:0 "Turn a blind eye"
 trade_collapse.2.t:0 "Peripheral Disengagement"
 trade_collapse.2.desc:0 "Communities on the margins of the market are increasingly disconnected, seeing little benefit in participation and less reason to comply."
 trade_collapse.2.a:0 "Reintegrate them"
 trade_collapse.2.b:0 "Focus on the core"
 trade_collapse.3.t:0 "Erosion of Trade Networks"
 trade_collapse.3.desc:0 "As trust in the market erodes, established trade networks falter, leading to a decline in commerce and economic vitality."
 trade_collapse.3.a:0 "Invest in rebuilding networks"
 trade_collapse.3.b:0 "Accept the new reality"
 trade_collapse.4.t:0 "Tax Collection Falters"
 trade_collapse.4.desc:0 "Officials report increasing difficulty in collecting revenues, as traders and local authorities bypass formal channels."
 trade_collapse.4.a:0 "Enforce compliance"
 trade_collapse.4.b:0 "Accept reduced intake"
 trade_collapse.5.t:0 "Restored Market Confidence"
 trade_collapse.5.desc:0 "After difficulties, the cycle of economic downturn has been successfully reversed, giving us a path to regain normalcy."
 trade_collapse.5.a:0 "Let us finally continue our path."
 better_together.1.t:0 "A House Divided"
 better_together.1.d:0 "A long standing issue has begun to flare up in St. Louis, with the City and County administrations at each other's throats over how to handle the city's problems. The city has stood as the center of government since the collapse, yet the more populous Saint Louis County is demanding that the seat of government be moved there to reflect that it more central to governance."
 better_together.1.a:0 "This cannot end well..."
 better_together.2.t:0 "Political Infighting"
 better_together.2.d:0 "The political infighting in St. Louis has reached a fever pitch, with both sides blaming each other for the city's problems and refusing to cooperate on any initiatives. The situation is becoming increasingly untenable, and the people of St. Louis are growing weary of the constant bickering and lack of progress."
 better_together.2.a:0 "Politics isn't always so easy..."
 better_together.2.b:0 "This is unacceptable!"
 better_together.3.t:0 "Assassination!"
 better_together.3.d:0 "The political infighting in St. Louis has reached a boiling point, with tensions between the City and County administrations escalating to the point of violence. An assassination attempt on a prominent political figure has sent shockwaves through the city, further destabilizing an already fragile situation and leaving the people of St. Louis in fear for their safety."
 better_together.3.a:0 "This is unacceptable! Figure out the culprit!"
 better_together.3.b:0 "We must act with a light hand, lest we further destabilize ourselves."
 better_together.4.t:0 "East St. Louis Breakaway"
 better_together.4.d:0 "The political infighting in St. Louis has reached a breaking point, with the City and County administrations now openly at odds with each other. In a shocking turn of events, the city of East St. Louis has declared the Metro District Constitution null and void and begun operating independently."
 better_together.4.a:0 "They were the weakest of us, let them go."
 better_together.4.b:0 "It's one ferryboat away..."
 better_together.4.c:0 "A federation where you can leave at will is no federation at all!"
 better_together.5.t:0 "Better Together?"
 better_together.5.d:0 "Throughout all the turmoil, one thing remains clear: the people of St. Louis are one people. The City, County, and East St. Louis are all part of the same region, and their fates are intertwined. The people tire of the constant bickering and motions have been made to reunify the region under a single government. The question remains the started this: which shall be the center of government?"
 better_together.5.a:0 "St. Louis City, the historic center of the region!"
 better_together.5.b:0 "St. Louis County, the population mainstay!"
 better_together.5.c:0 "St. Charles County, the rising economic hub!"
 urban_decay.1.t:0 "Urban Decay"
 urban_decay.1.d:0 "Perceptions of urban decay are on the rise, with many residents expressing concern about the state of our cities. Issues such as crime, poverty, and infrastructure deterioration are contributing to a sense of decline and hopelessness in urban areas."
 urban_decay.1.a:0 "What are our options?"
 urban_decay.2.t:0 "Urban Flight"
 urban_decay.2.d:0 "As the city continues to decay, more and more people are choosing to leave for the suburbs or other regions. This is leading to a decline in population and economic activity in the city, only compounding reasons for people to desire to leave the cities."
 urban_decay.2.a:0 "Get me the cat herder!"
 urban_decay.3.t:0 "Infrastructure Maintenance"
 urban_decay.3.d:0 "An issue has become apparent during the budgeting process. Repairs that were scheduled to be made to the city's infrastructure have been delayed due to lack of funding. We can move to overlook the issue for now, or go ahead and run a budget deficit to ensure the repairs are made."
 urban_decay.3.a:0 "To skimp on infrastructure is to invite further decay."
 urban_decay.3.b:0 "To ignore our budget limitations in such a situation would be unwise."
 urban_decay.4.t:0 "Capital Flight"
 urban_decay.4.d:0 "As the city continues to decay, more and more businesses are choosing to leave for the suburbs or other regions. This is leading to a decline in economic activity in the city, only compounding reasons for businesses to desire to leave the cities."
 urban_decay.4.a:0 "The stand in the way of the free market is foolish."
 urban_decay.4.b:0 "Grant the businesses tax breaks to make it worth their time to stay."
 urban_decay.5.t:0 "Urban Riots"
 urban_decay.5.d:0 "Youth and poor unemployment are at all time highs in urban centers, and the people are growing restless. The cities are on the brink of chaos."
 urban_decay.5.a:0 "Peaceful protests are a right, but we cannot allow our cities to burn."
 urban_decay.6.t:0 "Urban Renewal"
 urban_decay.6.d:0 "The cities are in a state of decay, but signs are showing that the situation has stabilized. The people are hopeful that with the right policies, we can turn things around and revitalize our urban centers, both new and old."
 urban_decay.6.a:0 "Let history show that this was a period of transition, not collapse."

 rising_horde.1.t:0 "The Opportunity Cost of Peace"
 rising_horde.1.d:0 "Reports have come in regarding the state of the frontier. The frontier city has fallen, and the hordes are now at the gates of the next city. The people are growing restless, and many are calling for a renewed focus on defense and militarization to prepare for the inevitable conflict ahead."
 rising_horde.1.a:0 "Use everything at our disposal to reorient our economy for war material."
 rising_horde.1.b:0 "Set meetings with our large merchants, we'll coordinate to their needs."
 rising_horde.2.t:0 "Reactivating the Arms Industry"
 rising_horde.2.d:0 "Industrial surveys have revealed that much of our industrial capacity has been repurposed for civilian use, and will require significant investment and retooling to meet the demands of war production. The question is whether we should invest heavily in reviving the industry, or if we should work with our merchants to coordinate the transition."
 rising_horde.2.a:0 "Get us the war materials we need."
 rising_horde.2.b:0 "Be methodical, theoretical output doesn't equate to practical effectiveness."
 rising_horde.3.t:0 "Untrained Levies"
 rising_horde.3.d:0 "Our Officer Corps has atrophied, and the majority of upper military leadership has never been in a real conflict. New recruits are being conscripted, but they lack the training and experience necessary to be effective on the battlefield. The question is whether we should rush them into battle or take the time to properly train them."
 rising_horde.3.a:0 "We simply lack the time, we must be decisive."
 rising_horde.3.b:0 "Train them properly, even if it takes time."
 rising_horde.4.t:0 "Strain on the Treasury"
 rising_horde.4.d:0 "None of our budget predictions are adequate for the demands of war production. Prudence has been called for by some out of fear we are risking our financial solvency on the offchance of war."
 rising_horde.4.a:0 "Spend whatever is necessary. It will be worthless to us if we lose the war."
 rising_horde.4.b:0 "Audit the system for waste."
 rising_horde.5.t:0 "Merchant Pressure"
 rising_horde.5.d:0 "Trade has completely been distrupted due to the situation in the west, with merchants attempting to salvage their profits. Some are threatening to relocate eastwards to escape, while others are trying to negotiate for protection to continue their operations and supply the towns on the frontier."
 rising_horde.5.a:0 "Let them leave, they will return during peace."
 rising_horde.5.b:0 "Redirect trade through protected corridors."
 rising_horde.5.c:0 "Negotiate with merchants for protection details."
 rising_horde.6.t:0 "Militarization of the Trade State"
 rising_horde.6.d:0 "After backrooms dealings and negotiations, the council has forwarded a resolution to overhaul the state in a way not seen since the Chicagoan Compact, standing ready for conflict and to defend our people and way of life."
 rising_horde.6.a:0 "We must reform or perish."
 rising_horde.6.b:0 "Peace through trade has yet to fail us."
 rising_horde.7.t:0 "Wartime Structures Dissolve"
 rising_horde.7.d:0 "The war is won and the immediate threat has passed. The structures put in place to meet the demands of war are no longer necessary, and the state has begun the process of demobilization and nudging commerce to return to peacetime."
 rising_horde.7.a:0 "Let us begin on rebuilding."
 chicago_mob.1.t:0 "Chicago Mob Activity"
 chicago_mob.1.d:0 "Reports have come in regarding increased mob activity in Chicago. The city's underworld has been growing bolder, and the authorities are struggling to maintain order."
 chicago_mob.1.a:0 "Launch a full-scale investigation and crackdown on the mob."
 chicago_mob.1.b:0 "An investigation is unnecessary, we shall continue as is."
 chicago_mob.2.t:0 "Law Enforcement Compromised"
 chicago_mob.2.d:0 "The mob's influence has reached into the city's law enforcement agencies, compromising their ability to effectively combat organized crime. Corruption and intimidation have weakened the rule of law, making it increasingly difficult to maintain order."
 chicago_mob.2.a:0 "Purge the compromised elements and restore integrity to the force."
 chicago_mob.2.b:0 "Attempt to work around the compromised elements and continue operations."
 chicago_mob.3.t:0 "Parallel Taxation"
 chicago_mob.3.d:0 "The mob has established its own parallel taxation system, through the extortion of 'protection payments', creating a shadow economy that undermines legitimate commerce and erodes public trust in official law enforcement."
 chicago_mob.3.a:0 "Crack down on the mob's extortion activities and protect local businesses."
 chicago_mob.3.b:0 "How hypocritical of them to not hand over some for their own protection."
 chicago_mob.4.t:0 "Institutional Corruption"
 chicago_mob.4.d:0 "The mob's influence has permeated various institutions in the city, including politics, business, and even the judiciary. This has led to a culture of corruption and impunity, where the mob operates with relative freedom and little fear of consequences."
 chicago_mob.4.a:0 "Implement strict anti-corruption measures and hold those complicit accountable."
 chicago_mob.4.b:0 "The mob's influence is too deeply entrenched to root out completely, we must learn to coexist."
 chicago_mob.5.t:0 "The Question of Authority"
 chicago_mob.5.d:0 "The mob's influence has reached a point where it is appearing to subsume the authority of the city's government and law enforcement. This has led to a crisis of legitimacy, where the public is increasingly questioning who truly holds power in the city and whether the government can effectively protect its citizens."
 chicago_mob.5.a:0 "Rip out the influence completely by the roots, no matter the cost."
 chicago_mob.5.b:0 "We know who holds the real power, why the false pretext?"
 chicago_mob.6.t:0 "Localized Violence"
 chicago_mob.6.d:0 "Outfit members have been spotted committing violent acts in various neighborhoods, indicating a growing trend of organized criminal activity."
 chicago_mob.6.a:0 "Increase patrols and law enforcement presence in affected areas."
 chicago_mob.7.t:0 "Police Crackdown"
 chicago_mob.7.d:0 "In response to the growing mob activity, the police have launched a crackdown on organized crime, targeting known mob members and their associates. This has led to a significant increase in arrests and seizures of illegal assets, but has also sparked concerns about potential overreach and civil liberties."
 chicago_mob.7.a:0 "Support the police crackdown and ensure it is conducted within the bounds of the law."
 chicago_mob.8.t:0 "Mob Retaliation"
 chicago_mob.8.d:0 "In response to law enforcement actions, the mob has retaliated with a wave of violence, targeting law enforcement officers, government officials, and rival gangs. This has led to a significant escalation in violence and has raised concerns about public safety and the potential for further retaliation."
 chicago_mob.8.a:0 "Increase security measures and support law enforcement efforts to combat mob violence."
 flavor_usa.1905.t:0 "Another Settlement Needs Our Help"
 flavor_usa.1905.desc:0 "The people of $PROVINCE$ are worried by the reports of encroaching settlements by the governed, and have reached out to us, petitioning us to incorporate them into our realm to protect them from the dangers. Do we have a responsibility to protect our people, even if they are not yet under our jurisdiction?"
 flavor_usa.1905.a:0 "We have a duty to protect our people, we cannot leave them."
 flavor_usa.1905.b:0 "We cannot be responsible for everyone, let them fend for themselves."