 petition_join_midwest_bloc_desc:0 "Request to join target's Economic Bloc as a Peripheral Market"
 petition_join_midwest_bloc_dialog:0 "A fellow tradestate has petitioned to join your economic bloc, seeking the benefits of closer trade ties and economic cooperation. Will you accept their request and expand your influence, or deny them and maintain the current structure of your bloc?"
 inverted_corruption:0 "Corruption"
 inverted_corruption_desc:0 "Corruption can destroy state institutions and undermine governance, but for us it is a tool like any other, to be wielded for our own benefit."
 consult_the_outfit:0 "Consult the Outfit"
 consult_the_outfit_desc:0 "The Outfit, the Chicagoan organized crime syndicate, has significant influence over the city's political and economic landscape. Consulting them may provide valuable insights."
