 cb_fairbault:0 "Fairbault's Subjugation"
 cb_fairbault_desc:0 "The city of Fairbault has long been a thorn in our side, its strategic location and economic potential making it a constant target for our ambitions. With the city now under our control, we will finally secure our influence over the region and reap the benefits of its resources and trade routes. This will not only strengthens our position but also sends a clear message to those across the river."
 po_midwest_compact_reinforcement:0 "Chicagoan Compact Enforcement"
 po_midwest_compact_reinforcement_desc:0 "Enforce the Chicagoan Compact"
 CB_ALLOWED_po_midwest_compact_reinforcement:0 "We will not allow the Compact to be violated with impunity. Any aggression against our trading partners will be met with swift and decisive retaliation, demonstrating that the Compact is not just a piece of paper, but a binding agreement that we are prepared to defend at all costs."
 PEACE_po_midwest_compact_reinforcement:0 "Enforce the Compact"
 po_unify_mn_market:0 "Unify the Minnesota Market"
 po_unify_mn_market_desc:0 "Unify the divided Minnesota Market"
 CB_ALLOWED_po_unify_mn_market:0 "We will not allow the Minnesota Market to remain divided and vulnerable. By unifying it under our control, we can strengthen our economic position and ensure that our influence extends across the entire region. This will not only benefit us but also create a more stable and prosperous market for all involved."
 PEACE_po_unify_mn_market:0 "Market Unification"
 centralize_minnesota:0 "Unify the Minnesota Market"
 centralize_minnesota_desc:0 "We have failed to unify the market economically, now we shall do so militarily."
