l_english:
 urban_alaska:0 "Urban Alaska"
 urban_alaska_desc:0 "Alaska’s cities—Anchorage, Juneau, Fairbanks—endured where towns faltered, their fleets, oil, and harbors sustaining life through collapse. Bound by conquest and necessity, these urban bastions forged unity and now turn outward, seeking wealth in the hinterlands and coasts beyond."
 stateless_society:0 "Independent Borough"
 stateless_society_desc:0 "Isolated cities rise amidst the now untamed expanse of Alaska, each maintaining order within its own walls. Authority cannot stretch far beyond the urban centers, and threats are few—coming only from neighboring cities willing to cross the vast regrowing wilderness between them."
 STATELESS_SOCIETY:0 "Independent Borough"
 triggered_modifier_ak_home_colonization_buff:0 "An Alaskan colonizing Alaska"
 dixie_republic:0 "Aristocratic Republic"
 dixie_republic_desc:0 "Unlike the Carpetbaggers which give in to the guiles of mercantiles, we never put down our dreams of being lords over our own domains. Our Ancestors fought for our lands and our people stand free from their repression. War and Will shall lead our way!"
 dixie_autocracy_reform:0 "Despotic Republic"
 dixie_autocracy_reform_desc:0 "Since the fall of our great land and the refusal of those then in power to stave off losses, we have nominated the strongest and most visionary among us to lead our people in these troubling times."
 frontier_republic:0 "Republican Syndicate"
 frontier_republic_desc:0 "By incorporating the most powerful among us into our government we can ensure that we have the strength to hold off against the strength of our neighbors."
 frontier_kingdom_reform:0 "Despotic Syndicate"
 frontier_kingdom_reform_desc:0 "We shall lead by example, and include the most successful among us to help ensure our prosperity."
 bismarck_steppe_horde:0 "Steppe Horde"
 bismarck_steppe_horde_desc:0 "Forged on the frontier through brutal isolation and neglect, the Bismarck Steppe Horde melds German martial discipline with the fierce self-reliance of its American and steppe traditions. Its warriors stand always ready, harnessing both heritage and adaptability to secure the state’s strength and independence."
 cartel_republic_reform:0 "Cartel Republic"
 cartel_republic_reform_desc:0 "Governments are not without their troubles, among them the flow and trade of illicit substances. The state in this case has proven too weak to prevent influence from those that stand to gain from others suffering."
 corporatocracy:0 "Corporatocracy"
 corporatocracy_desc:0 "Highly profitable yet extremely unpopular with their tenants, Corporatocracies exist solely to the end goal of extracting resources from the land for export. Once spattered throughout the American Rockies, they've lost significant market penetration due to the success of the Miner Rebellions."
 prospector_funding:0 "Prospector Funding"
 desc_prospector_funding:0 "Labor and materials are always in short supply, not due to lack of resources, but instead to manpower. To prospect requires excaerbating such conditions, even for a short time."
 prospecting_decision_title:0 "Prospecting"
 prospecting_decision_desc:0 "By far the most profitable thing is mining. Though expensive, we can send a government funded expedition to determine if we've overlooked a potential new source for exploitation.  As the saying goes, 'There's gold in them thar hills.'"
 integrate_american_territories_title:0 "Integrate American Territories"
 integrate_american_territories_desc:0 "The American Empire was an odd empire. Unlike others at the trime of her founding, th e United States made a decision that her conquered territories would be granted the same powers and rights as her standing states, when they had achieved their population thresholds. To ignore the requests of our incorporated territories would be to ignore the very foundation of our country, and to risk alienating our countrymen."
 nebraska_empire_form_title:0 "Found the Nebraska Empire"
 nebraska_empire_form_desc:0 "We have united the prominent plainspeople under our banner and have demonstrated our strength and resolve by seizing critical cities from the eastern traders. Upon these accomplishments the people of the Midwest will be able to grasp their own destiny under one banner!"
 midwest_mercantilism:0 "Midwestern Compact"
 ability_midwest_mercantilism:0 "Midwestern Compact"
 regional_influence:0 "Regional Influence"
 regional_influence_gain_modifier:0 "Regional Influence Change"
 monthly_regional_influence:0 "Monthly Influence"
 force_influence:0 "Force Influence"
 force_influence_desc:0 "Influence is something best gained through the soft power of markets, but the wheels can always be greased when traders sense profits."
 form_four_corners_title:0 "Form the Four Corners Republic"
 form_four_corners_desc:0 "Nowhere else in the world can you find such a border. To ignore it would be to dismiss a unique opportunity."
 midwest_bloc_subordinate_title:0 "Peripheral Market"
 midwest_bloc_subordinate_title_plural:0 "Peripheral Markets"
 midwest_bloc_subordinate_long_desc:0 "With the Chicagoan treaty outlawing warfare between the people of the midwest, a new era of economic cooperation had officially begun, where domination is replaced by mutual benefit, the peoples are free to trade and collaborate in whichever way they see fit, though markets have demonstrated that weaker states remain on the peripheral."
 midwest_bloc_subordinate_is_our:0 "$NAME|Y$ is a Peripheral Market"
 midwestern_trade_hub:0 "Plutocratic Trade Hub"
 midwestern_trade_hub_desc:0 "This state has positioned itself as a central node within the regional market, facilitating the flow of goods, capital, and information between surrounding territories. Governed through civic institutions and commercial councils, the Trade Hub prioritizes openness and coordination over control, relying on mutual participation to sustain its influence. Its strength lies not in domination, but in its indispensability to the broader network."
 proscriptive_trade_hub:0 "Proscriptive Trade Hub"
 proscriptive_trade_hub_desc:0 "Trade within this realm is not merely encouraged—it is directed. The state has established firm controls over the movement of goods, licensing merchants and restricting access to key markets. While this ensures stability and predictable revenues, it also binds the economic life of the region tightly to the authority of the state. Participation in the market is a privilege granted, not a right exercised."
 midwest_chartered_company_government:0 "Chartered Company Administration"
 midwest_chartered_company_government_desc:0 "On the fringes of the Midwest, where central authority fades and external threats loom, cities have lended their authority to chartered companies. These entities combine commercial ambition with military necessity, maintaining private forces to secure trade routes and settlements against nomadic incursions. Though nominally subordinate, in action they function as a government within a company."
 chicago_title:0 "Metropolitan Exchange Authority"
 chicago_desc:0 "Chicago stands as the preeminent nexus of trade and coordination within the Midwest, its influence mostly rebuilt from the ashes of past conflicts. Through a dense web of financial institutions, logistical networks, and political leverage, the city tendrils a quiet but undeniable dominance over regional commerce. Control here is not always direct, but it is deeply felt—those who engage with her market inevitably find themselves operating on Chicago’s terms."
 midwestern_trade_hub_agressive:0 "Fortified Trade Hub"
 midwestern_trade_hub_agressive_desc:0 "Once defined by open exchange, this hub now treats its commercial networks as assets to be secured and directed. Trade remains central, but no longer stands alone; routes, partners, and markets are increasingly shaped by considerations beyond profit, as the state adapts its foundations to a more demanding environment."
 proscriptive_trade_hub_aggressive:0 "Directed Command Hub"
 proscriptive_trade_hub_aggressive_desc:0 "Trade within this system has always been subject to centralized planning and enforcement. That same structure now governs broader state functions, coordinating economic and security priorities as a single, unified apparatus. Markets operate as components of a larger design, directed from above."
 midwest_chartered_company_government_aggressive:0 "Expeditionary Company Authority"
 midwest_chartered_company_government_aggressive_desc:0 "Chartered companies, long entrusted with the security of trade, have extended their reach to match the scale of their challenges. Commercial and military functions now operate in tandem, with company forces ensuring the continuity of exchange across an increasingly contested landscape."
 chicago_aggressive:0 "Metropolitan Command Exchange"
 chicago_aggressive_desc:0 "Chicago’s vast commercial system has evolved into a structure capable of both sustaining and directing regional exchange. Its networks do not merely connect markets—they organize them, aligning trade flows with broader strategic aims while maintaining the scale and efficiency that define the city’s dominance."
 create_monetary_union_title:0 "Create a Monetary Union"
 create_monetary_union_desc:0 "The economies of the Midwest are deeply intertwined yet still fragmented from their heyday. We can resolve part of this by exstablishing a monetary union, creating a common currency and central bank to facilitate trade and investment across our economic bloc. This would reduce transaction costs, stabilize exchange rates, and promote economic integration, but it would also require ceding some fiscal autonomy to a regional authority."
 leave_current_midwest_bloc_title:0 "Leave Our Current Midwest Bloc"
 leave_current_midwest_bloc_desc:0 "The Midwest Bloc has proven to be a source of stability and cooperation, but it has also limited our ability to pursue independent economic policies. By leaving, we can regain full control over our trade and fiscal decisions, allowing us to tailor our economic strategy to our specific needs and priorities. However, this would also mean losing the benefits of regional cooperation and potentially isolating ourselves from our neighbors."
 leave_current_midwest_bloc_tooltip:0 "Our Regional Influence ought to be higher than our former overlord's, lest we may find ourselves crawling back."
 leave_midwest_compact_title:0 "Rescind the Chicagoan Compact"
 leave_midwest_compact_desc:0 "The Chicagoan Compact has been a cornerstone of regional peace and prosperity, but it has hampered our ability to assert our influence as we should. This action will leave a permanent mark on our relationships in the region as a whole, but it will grant us more mobility in our foreign policy."
