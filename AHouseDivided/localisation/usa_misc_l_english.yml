l_english:
 urban_alaska:0 "Urban Alaska"
 urban_alaska_desc:0 "Alaska’s cities—Anchorage, Juneau, Fairbanks—endured where towns faltered, their fleets, oil, and harbors sustaining life through collapse. Bound by conquest and necessity, these urban bastions forged unity and now turn outward, seeking wealth in the hinterlands and coasts beyond."
 stateless_society:0 "Independent Borough"
 stateless_society_desc:0 "Isolated cities rise amidst the now untamed expanse of Alaska, each maintaining order within its own walls. Authority cannot stretch far beyond the urban centers, and threats are few—coming only from neighboring cities willing to cross the vast regrowing wilderness between them."
 STATELESS_SOCIETY:0 "Independent Borough"