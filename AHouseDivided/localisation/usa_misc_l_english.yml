 invite_to_midwest_bloc_title:0 "Invite to Midwest Bloc"
 invite_to_midwest_bloc_desc:0 "Invite target to join your economic bloc as a Peripheral Market"
 invite_to_midwest_bloc_dialog:0 "Do you wish to join the economic bloc of your neighbor? Joining their bloc will grant you access to their markets and economic cooperation, but it will also make you more dependent on their influence and policies. Consider the benefits and drawbacks before accepting their invitation."
 chicago_outfit:0 "The Outfit"
 chicago_outfit_desc:0 "The Outfit, the Chicagoan organized crime syndicate, has significant influence over the city's political and economic landscape. The Outfit's power is deeply entrenched, with connections that span from the highest levels of government to the most influential business circles. Their operations are vast and varied, encompassing everything from illicit trade to political manipulation. Engaging with the Outfit can provide valuable insights and resources, but it also carries significant risks given their notorious reputation and the potential for backlash from law enforcement and rival factions."
 ability_corruption_scaling:0 "Corruption Scaling"
 inverted_corruption_gain_modifier:0 "Corruption Gain"
 monthly_inverted_corruption:0 "Monthly Corruption Change"
 subsidiaries_title:0 "Subsidiary"
 subsidiaries_title_plural:0 "Subsidiaries"
 subsidiaries_is_our:0 "$NAME|Y$ is a Subsidiary"
 subsidiaries_long_desc:0 "We are not a state, yet we have a population. To aid in better controlling and extracting resources based on local conditions, we have established subsidiaries. These entities are not fully fledged states, but they are more than mere territories."
 cb_midwest_compact:0 "Enforce Chicago Compact"
 cb_midwest_compact_desc:0 "The Chicagoan Compact has been the cornerstone of regional peace and prosperity yet it stands against its greatest test now. By enforcing the Compact, we can demonstrate our commitment to regional stability and the rule of law while also deterring future violations."
 reinforce_midwestern_compact:0 "Reinforce Chicago Compact"
 reinforce_midwestern_compact_desc:0 ""
 cb_purge_outfit:0 "Purge the Outfit"
 cb_purge_outfit_desc:0 "Tracing the sources of our recent corruption woes points to the Outfit, a notorious organized crime syndicate with deep roots in Chicago's political and economic landscape."
