 remove_urban_blight_title:0 "Remove Urban Blight"
 remove_urban_blight_desc:0 "Our cities are gutting themselves and turning to crime and corruption to survive. This is a disaster that will only get worse if we do not take action, but it is also an opportunity to rebuild our cities in a way that is more sustainable and resilient."
