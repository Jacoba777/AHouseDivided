 rising_horde_tt:0 "Is a §YHorde§! and has §Y300§! own and non-tributary subject total development"
 rising_horde:0 "The Rising Horde"
 rising_horde_desc:0 "After Federal retreat beyond the Appalachia, it was assumed the plains would stay divided and eventually fold under organized rule. For years the hordes were treated as a nuisance, with raids and border instability managed as routine. That assumption has failed. A unified movement now rejects settled life itself and, if the reports are to be believed, we stand woefully unprepared."
