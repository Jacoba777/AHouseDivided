l_english:
 bookmark_northeast:0 "The Northeastern City-States"
 bookmark_northeast_desc:0 "The historic political, economic, and cultural heart of United States, the northeast was the federal governments seat and final bastion of control. The Empire of Liberty, as she is now known, controls scant little more than the Acela Corridor while still continuing to shrink at her peripheries. Long since separated from the Vatican, Catholics in America have elected a new Pope, housed in Jersey Shore, to provide a sense of continuity in these uncertain times."
 bookmark_midwest:0 "A Fractured Midwest"
 bookmark_midwest_desc:0 "From the shimmering Great Lakes to the fertile Great Plains, the Midwest has survived the unravelling she began to a greater extent than other regions with her historic reliance on trading. The eastern portion is populated by trading blocs led by the major cities, with the upstart Pittsburgh looking to establish herself, while past Kansas City the people of the region have shunned formal governance entirely, with the notable exceptions of the largest cities."
 bookmark_south:0 "Divided Dixieland"
 bookmark_south_desc:0 "The Sunny South has exploded into a tapestry of competing powers for southern dominance. The Confederation, which bound the region together, has voted for a emergency convention to draft a new constitution, leaving behind her settlements in an uneasy peace. Far to the west in Texas, Houston sits in the seat of the Texan Presidency. The continuing rivalry between the islands of the New South and the mainstay of the Old South serve to further invite conflict, particularly with the ensuing 3rd revolt."
 bookmark_west:0 "The Tribes of the West"
 bookmark_west_desc:0 "The Wild West, as it is once again called, is isolated from the happenings beyond the mighty Rockies. California has barely held together as a polity while coastal Cascadia begins feeling encroachment by a native power. Denver and the Mormons stand as the two settled areas left within the mountians themselves, while a spattering of mining companies sit alongside the sparse nomad governments throughout."
 bookmark_linear_dev:0 "Alternative Start: Linear Dev"
 bookmark_linear_dev_desc:0 "This scenario is the same as the previous four, but development is scaled linearly rather than logarithmically. This creates provinces with extremely high development around cities (LA county is over 900 dev), and most provinces are 3 development, creating very unbalanced gameplay."
 bookmark_fifty_states:0 "Alternative Start: 50 States"
 bookmark_fifty_states_desc:0 "(Note: This scenario uses the linear dev scale. Read the bookmark description for Linear Dev for more information.). With the Federal Goverment dissolved, the fifty states have found themselves all on their own. Inter-state tensions remain high, and war seems inevitable. Can the people of the United States be brought together under one nation once more?"